<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarbCam Web-App Integration (v3)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 24px 16px;
    }
    .page-wrap {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
    }
    h1, h2 {
      margin: 0 0 12px;
    }
    h1 { font-size: 1.35rem; }
    h2 { font-size: 1.05rem; color: #334155; }
    .form-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .field-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
    }
    .key-input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .key-input-wrap input {
      flex: 1;
      border: none;
      padding: 9px 12px;
      font-size: 0.9rem;
      outline: none;
    }
    .eye-btn {
      background: #f8fafc;
      border: none;
      border-left: 1px solid #e2e8f0;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }
    .eye-btn:hover {
      background: #e2e8f0;
    }
    .main-input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      width: 140px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-secondary {
      background: #0f172a;
      color: #fff;
    }
    .save-msg {
      font-size: 0.85rem;
      color: #16a34a;
      font-weight: 600;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <!-- Bereich 1: Deine bestehende Mahlzeiten-Erfassung -->
    <section class="card">
      <h1>Mahlzeit erfassen</h1>
      <div class="form-row">
        <label for="mainCarbsInput"><strong>Kohlenhydrate (g):</strong></label>
        <input type="number" id="mainCarbsInput" class="main-input" placeholder="z. B. 50" />
        <button type="button" id="openCarbCamBtn" class="btn btn-primary">
          📷 Foto-Scanner öffnen
        </button>
      </div>
    </section>

    <!-- Bereich 2: Deine bestehende Konfigurations-Oberfläche (localStorage) -->
    <section class="card">
      <h2>API-Konfiguration (lokal im Browser gespeichert)</h2>

      <div class="field-group">
        <label for="cfgGroqKey">Groq API-Key (<code>carbcam_groq_api_key</code>)</label>
        <div class="key-input-wrap">
          <input type="password" id="cfgGroqKey" placeholder="gsk_..." />
          <button type="button" class="eye-btn" data-target="cfgGroqKey" aria-label="Key anzeigen">👁️</button>
        </div>
      </div>

      <div class="field-group">
        <label for="cfgGeminiKey">Google Gemini API-Key (<code>carbcam_gemini_api_key</code>)</label>
        <div class="key-input-wrap">
          <input type="password" id="cfgGeminiKey" placeholder="AIza..." />
          <button type="button" class="eye-btn" data-target="cfgGeminiKey" aria-label="Key anzeigen">👁️</button>
        </div>
      </div>

      <div class="field-group">
        <label for="cfgClaudeKey">Anthropic Claude API-Key – optional (<code>carbcam_claude_api_key</code>)</label>
        <div class="key-input-wrap">
          <input type="password" id="cfgClaudeKey" placeholder="sk-ant-... (optional)" />
          <button type="button" class="eye-btn" data-target="cfgClaudeKey" aria-label="Key anzeigen">👁️</button>
        </div>
      </div>

      <div>
        <button type="button" id="saveKeysBtn" class="btn btn-secondary">Keys im Browser speichern</button>
        <span id="saveFeedback" class="save-msg" hidden>Gespeichert!</span>
      </div>
    </section>
  </div>

  <!-- Ausgelagerter CarbCam-Scanner mit automatischer Pfaderkennung für das Dialog-HTML -->
  <script src="carbcam-scanner-v3.js" data-dialog-url="carbcam-dialog-v3.html"></script>
  <script>
    // 1. Gespeicherte Keys in die Konfigurationsfelder laden
    const KEY_MAP = {
      cfgGroqKey: "carbcam_groq_api_key",
      cfgGeminiKey: "carbcam_gemini_api_key",
      cfgClaudeKey: "carbcam_claude_api_key"
    };

    Object.entries(KEY_MAP).forEach(([inputId, storageKey]) => {
      const el = document.getElementById(inputId);
      if (el) el.value = localStorage.getItem(storageKey) || "";
    });

    // 2. Auge-Button (Passwort sichtbar / unsichtbar schalten)
    document.querySelectorAll(".eye-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.getAttribute("data-target"));
        if (!input) return;
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        btn.textContent = isHidden ? "🙈" : "👁️";
      });
    });

    // 3. Keys im localStorage speichern
    document.getElementById("saveKeysBtn").addEventListener("click", () => {
      Object.entries(KEY_MAP).forEach(([inputId, storageKey]) => {
        const val = document.getElementById(inputId).value.trim();
        if (val) {
          localStorage.setItem(storageKey, val);
        } else {
          localStorage.removeItem(storageKey);
        }
      });
      const fb = document.getElementById("saveFeedback");
      fb.hidden = false;
      setTimeout(() => (fb.hidden = true), 2500);
    });

    // 4. CarbCam-Scanner initialisieren (lädt carbcam-dialog-v3.html automatisch nach)
    CarbCamScanner.init({
      triggerSelector: "#openCarbCamBtn",
      targetInputSelector: "#mainCarbsInput",
      groqKeyStorageName: "carbcam_groq_api_key",
      geminiKeyStorageName: "carbcam_gemini_api_key",
      claudeKeyStorageName: "carbcam_claude_api_key",
      onApply: (result) => {
        console.log("Übernommene Kohlenhydrate:", result.totalCarbs, result.items);
      }
    });
  </script>
</body>
</html>
