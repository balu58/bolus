name: Deploy to Public Pages Repo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Seite nach temp-pages kopieren
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: balu58/temp-pages
          publish_branch: main
          publish_dir: .
