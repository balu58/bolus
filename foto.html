<video id="kamera" autoplay playsinline></video>
<button id="start">Kamera starten</button>
<button id="stop">Kamera stoppen</button>

<script>
  let stream;

  document.querySelector("#start").addEventListener("click", async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }, // Rückkamera; "user" für Frontkamera
        audio: false
      });

      document.querySelector("#kamera").srcObject = stream;
    } catch (error) {
      console.error("Kamera konnte nicht gestartet werden:", error);
    }
  });

  document.querySelector("#stop").addEventListener("click", () => {
    stream?.getTracks().forEach(track => track.stop());
    stream = null;
  });
</script>
