<style>
  #carbcamModal.cc-modal {
    border: 1px solid var(--line, #D5DCE5);
    border-radius: 14px;
    padding: 0;
    width: min(94vw, 560px);
    max-height: 92vh;
    background: var(--surface, #FFFFFF);
    color: var(--ink, #16233A);
    box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.45;
  }
  #carbcamModal.cc-modal::backdrop {
    background: rgba(15, 23, 42, 0.6);
  }
  .cc-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px;
    overflow-y: auto;
    max-height: 92vh;
    box-sizing: border-box;
  }
  .cc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line, #D5DCE5);
    padding-bottom: 10px;
  }
  .cc-title {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink, #16233A);
  }
  .cc-icon-btn {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    color: var(--muted, #5B6678);
    padding: 0 4px;
  }
  .cc-models {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  @media (max-width: 520px) {
    .cc-models {
      grid-template-columns: 1fr;
    }
  }
  .cc-model-card {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 9px 11px;
    border: 1.5px solid var(--line, #D5DCE5);
    border-radius: 10px;
    background: var(--bg, #EEF2F6);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .cc-model-card.active {
    border-color: var(--accent, #2463D6);
    background: var(--accent-soft, #DCE7FB);
  }
  .cc-model-card input[type="radio"] {
    display: none;
  }
  .cc-model-name {
    font-weight: 700;
    font-size: 0.88rem;
    color: var(--ink, #16233A);
  }
  .cc-model-sub {
    font-size: 0.74rem;
    color: var(--muted, #5B6678);
    word-break: break-word;
  }
  .cc-upload-section {
    border: 1.5px dashed var(--line, #D5DCE5);
    border-radius: 10px;
    padding: 12px;
    background: var(--bg, #EEF2F6);
    text-align: center;
  }
  .cc-upload-actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cc-hint-text {
    font-size: 0.78rem;
    color: var(--muted, #5B6678);
    margin: 8px 0 0;
  }
  .cc-preview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .cc-preview-grid:empty {
    display: none;
  }
  .cc-thumb-wrap {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line, #D5DCE5);
    aspect-ratio: 4 / 3;
    background: #000;
  }
  .cc-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cc-thumb-badge {
    position: absolute;
    left: 4px;
    bottom: 4px;
    background: rgba(15, 23, 36, 0.78);
    color: #fff;
    font-size: 0.68rem;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .cc-thumb-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    background: var(--red, #D93025);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 21px;
    height: 21px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .cc-tip-section {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .cc-label {
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--ink, #16233A);
  }
  .cc-input {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 11px;
    border: 1px solid var(--line, #D5DCE5);
    border-radius: 8px;
    font-size: 0.92rem;
    background: var(--bg, #EEF2F6);
    color: var(--ink, #16233A);
  }
  .cc-status {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    background: var(--accent-soft, #DCE7FB);
    color: var(--ink, #16233A);
    border: 1px solid var(--accent, #2463D6);
  }
  .cc-status.error {
    background: var(--red-soft, #FCE3E1);
    color: var(--red, #D93025);
    border-color: var(--red, #D93025);
  }
  .cc-result-section {
    background: var(--ok-soft, #E6F4EA);
    border: 1px solid var(--ok, #1E8E5A);
    border-radius: 10px;
    padding: 12px;
  }
  .cc-result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cc-total-label {
    font-size: 1.02rem;
    color: var(--ink, #16233A);
  }
  .cc-btn-small {
    background: transparent;
    border: 1px solid var(--ok, #1E8E5A);
    color: var(--ok, #1E8E5A);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .cc-result-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
  }
  .cc-items-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cc-item-row {
    display: grid;
    grid-template-columns: 1.8fr 1fr 0.9fr 24px;
    gap: 6px;
    align-items: center;
  }
  .cc-item-row.cc-item-readonly {
    grid-template-columns: 1.8fr 1fr 0.9fr;
    align-items: start;
  }
  .cc-item-label {
    min-width: 0;
    box-sizing: border-box;
    padding: 9px 10px;
    border: 1px solid var(--line, #D5DCE5);
    border-radius: 6px;
    background: var(--ok-soft, #E6F4EA);
    color: var(--ink, #16233A);
    overflow-wrap: anywhere;
  }
  .cc-item-name {
    font-weight: 500;
  }
  .cc-item-value {
    white-space: nowrap;
  }
  .cc-item-row input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 7px;
    border: 1px solid var(--line, #D5DCE5);
    border-radius: 6px;
    font-size: 0.85rem;
    background: var(--surface, #FFFFFF);
    color: var(--ink, #16233A);
  }
  .cc-weight-cell {
    display: flex;
    flex-direction: column;
  }
  .cc-dry-tag {
    font-size: 0.7rem;
    color: var(--ok, #1E8E5A);
    margin-top: 1px;
  }
  .cc-carbs-cell {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .cc-del-row {
    background: none;
    border: none;
    color: var(--red, #D93025);
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }
  .cc-note {
    font-size: 0.8rem;
    color: var(--ink, #16233A);
    margin: 8px 0 4px;
  }
  .cc-timing {
    font-size: 0.74rem;
    color: var(--muted, #5B6678);
    margin: 0;
  }
  .cc-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line, #D5DCE5);
  }
  .cc-btn {
    padding: 9px 14px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .cc-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .cc-btn-dark {
    background: var(--accent, #2463D6);
    color: #fff;
  }
  .cc-btn-light {
    background: var(--surface, #FFFFFF);
    color: var(--ink, #16233A);
    border: 1px solid var(--line, #D5DCE5);
  }
  .cc-btn-primary {
    background: var(--accent, #2463D6);
    color: #fff;
  }
  .cc-btn-success {
    background: var(--ok, #1E8E5A);
    color: #fff;
  }
  .cc-disclaimer {
    font-size: 0.72rem;
    color: var(--muted, #5B6678);
    margin: 0;
    line-height: 1.35;
  }
</style>

<dialog id="carbcamModal" class="cc-modal">
  <div class="cc-container">
    <div class="cc-header">
      <h3 class="cc-title">Kohlenhydrate per Foto erfassen</h3>
      <button type="button" id="ccCloseTopBtn" class="cc-icon-btn" aria-label="Schließen">&times;</button>
    </div>

    <div class="cc-models" role="radiogroup" aria-label="KI-Modell wählen">
      <label class="cc-model-card active" data-provider="groq">
        <input type="radio" name="ccProvider" value="groq" checked />
        <span class="cc-model-name">Blitz-Scan (~1,5 s)</span>
        <span class="cc-model-sub">Groq Qwen 3.8 + Fallback</span>
      </label>
      <label class="cc-model-card" data-provider="gemini">
        <input type="radio" name="ccProvider" value="gemini" />
        <span class="cc-model-name">Detail-Scan (~8–10 s)</span>
        <span class="cc-model-sub">Gemini 3 Flash (Soßen & Extras)</span>
      </label>
      <label class="cc-model-card" data-provider="custom">
        <input type="radio" name="ccProvider" value="custom" />
        <span class="cc-model-name">Benutzerdefiniert</span>
        <span class="cc-model-sub" id="ccCustomSubLabel">Eigene API-URL & Key</span>
      </label>
    </div>

    <div class="cc-upload-section">
      <div class="cc-upload-actions">
        <button type="button" id="ccCameraBtn" class="cc-btn cc-btn-dark">Foto aufnehmen</button>
        <button type="button" id="ccGalleryBtn" class="cc-btn cc-btn-light">Aus Mediathek / Datei</button>
      </div>
      <p class="cc-hint-text">Bis zu 3 Perspektiven möglich (z. B. Draufsicht + 45°-Winkel).</p>
      <input type="file" id="ccCameraInput" accept="image/*" capture="environment" hidden />
      <input type="file" id="ccGalleryInput" accept="image/*" multiple hidden />
      <div id="ccPreviewGrid" class="cc-preview-grid"></div>
    </div>

    <div class="cc-tip-section">
      <label for="ccUserTip" class="cc-label">Optionaler Hinweis / Tipp für die KI</label>
      <input
        type="text"
        id="ccUserTip"
        class="cc-input"
        placeholder="z. B. Dünner Teig, Soße mit Stärke gebunden, Cola Zero..."
      />
    </div>

    <div id="ccStatusBox" class="cc-status" hidden></div>

    <div id="ccResultSection" class="cc-result-section" hidden>
      <div class="cc-result-header">
        <span class="cc-total-label">Gesamt: <strong id="ccTotalCarbs">0</strong> g Kohlenhydrate</span>
        <div class="cc-result-actions">
          <button type="button" id="ccEditToggleBtn" class="cc-btn-small" aria-pressed="false" aria-controls="ccItemsList">Werte korrigieren</button>
          <button type="button" id="ccAddRowBtn" class="cc-btn-small" hidden>+ Zutat</button>
        </div>
      </div>
      <div id="ccItemsList" class="cc-items-list"></div>
      <p id="ccAnalysisNote" class="cc-note"></p>
      <p id="ccTimingInfo" class="cc-timing"></p>
    </div>

    <div class="cc-footer">
      <button type="button" id="ccCancelBtn" class="cc-btn cc-btn-light">Abbrechen</button>
      <button type="button" id="ccAnalyzeBtn" class="cc-btn cc-btn-primary">Analysieren</button>
      <button type="button" id="ccApplyBtn" class="cc-btn cc-btn-success" hidden>Werte übernehmen</button>
    </div>

    <p class="cc-disclaimer">
      Ausschließlich zu Informationszwecken. Für medizinischen Rat oder eine Diagnose wende dich bitte an eine Fachkraft. Antworten von KI-Systemen können Fehler enthalten.
    </p>
  </div>
</dialog>
