<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deine Web-App (Beispiel für Modul-Einbindung)</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 30px 16px;
      background-color: #f4f6f9;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .card {
      max-width: 580px;
      width: 100%;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    h1, h2 {
      margin-top: 0;
      font-size: 1.25rem;
    }
    .field-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field-row label {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .field-row input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .inline-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .inline-row input[type="number"] {
      width: 110px;
      padding: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      text-align: right;
    }
    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-dark {
      background-color: #334155;
    }
    .info-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 0.85rem;
      color: #334155;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 1. Deine bestehende Web-App Oberfläche -->
  <div class="card">
    <h1>Meine Ernährungs- / Diabetes-App</h1>
    <div class="inline-row">
      <label for="mainCarbsInput"><strong>Kohlenhydrate (g):</strong></label>
      <input type="number" id="mainCarbsInput" value="0" min="0" />
      <!-- Dieser Button öffnet das ausgelagerte Scanner-Modul -->
      <button type="button" id="openCarbsScannerBtn" class="btn">KH per Foto ermitteln</button>
    </div>
    <div id="resultLog" class="info-box"></div>
  </div>

  <!-- 2. Deine vorhandene Konfigurations-Oberfläche (speichert Keys im localStorage) -->
  <div class="card">
    <h2>API-Konfiguration (lokaler Webspeicher)</h2>
    <div class="field-row">
      <label for="cfgGroqKey">Groq API-Key (<code>carbs_groq_api_key</code>):</label>
      <input type="password" id="cfgGroqKey" placeholder="gsk_..." />
    </div>
    <div class="field-row">
      <label for="cfgGeminiKey">Google Gemini API-Key (<code>carbs_gemini_api_key</code>):</label>
      <input type="password" id="cfgGeminiKey" placeholder="AIza..." />
    </div>
    <button type="button" id="saveCfgBtn" class="btn btn-dark">Keys im Browser speichern</button>
    <div id="cfgStatus" class="info-box"></div>
  </div>

  <!-- 3. Einbindung des ausgelagerten Dialog-Moduls (1 Zeile!) -->
  <script src="carbs-scanner.js"></script>
  <script>
    // Konfigurations-Felder aus dem localStorage laden & speichern
    const cfgGroqInput = document.getElementById("cfgGroqKey");
    const cfgGeminiInput = document.getElementById("cfgGeminiKey");
    const cfgStatus = document.getElementById("cfgStatus");

    cfgGroqInput.value = localStorage.getItem("carbs_groq_api_key") || "";
    cfgGeminiInput.value = localStorage.getItem("carbs_gemini_api_key") || "";

    document.getElementById("saveCfgBtn").addEventListener("click", () => {
      localStorage.setItem("carbs_groq_api_key", cfgGroqInput.value.trim());
      localStorage.setItem("carbs_gemini_api_key", cfgGeminiInput.value.trim());
      cfgStatus.textContent = "API-Keys sicher im lokalen Webspeicher (localStorage) gespeichert.";
      cfgStatus.style.display = "block";
    });

    // Scanner-Modul initialisieren und mit deiner Oberfläche verknüpfen
    CarbsScanner.init({
      triggerSelector: "#openCarbsScannerBtn",
      targetInputSelector: "#mainCarbsInput",
      groqKeyStorageName: "carbs_groq_api_key",
      geminiKeyStorageName: "carbs_gemini_api_key",
      onApply: (data) => {
        const log = document.getElementById("resultLog");
        const details = data.items
          .map((i) => `${i.name}: ${i.weight}g${i.dryWeight ? ` (tr: ${i.dryWeight}g)` : ""} = ${i.carbs}g KH`)
          .join(" | ");
        log.innerHTML = `<strong>Übernommen (${data.totalCarbs} g KH):</strong><br>${details}`;
        log.style.display = "block";
      }
    });
  </script>
</body>
</html>

</script>
