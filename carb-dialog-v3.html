<style>
  #carbModal.carb-modal {
    border: 1px solid var(--line, #D5DCE5);
    border-radius: 14px;
    padding: 0;
    width: min(94vw, 560px);
    max-height: 92vh;
    background: var(--surface, #FFFFFF);
    color: var(--ink, #16233A);
    box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.45;
  }
  #carbModal.carb-modal::backdrop {
    background: rgba(15, 23, 42, 0.6);
  }
  .carb-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px;
    overflow-y: auto;
    max-height: 92vh;
    box-sizing: border-box;
  }
  .carb-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line, #D5DCE5);
    padding-bottom: 10px;
  }
  .carb-title {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink, #16233A);
  }
  .carb-icon-btn {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    color: var(--muted, #5B6678);
    padding: 0 4px;
  }
  .carb-models {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  @media (max-width: 520px) {
    .carb-models {
      grid-template-columns: 1fr;
    }
  }
  .carb-model-card {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 9px 11px;
    border: 1.5px solid var(--line, #D5DCE5);
    border-radius: 10px;
    background: var(--bg, #EEF2F6);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .carb-model-card.active {
    border-color: var(--accent, #2463D6);
    background: var(--accent-soft, #DCE7FB);
  }
  .carb-model-card input[type="radio"] {
    display: none;
  }
  .carb-model-name {
    font-weight: 700;
    font-size: 0.88rem;
    color: var(--ink, #16233A);
  }
  .carb-model-sub {
    font-size: 0.74rem;
    color: var(--muted, #5B6678);
    word-break: break-word;
  }
  .carb-upload-section {
    border: 1.5px dashed var(--line, #D5DCE5);
    border-radius: 10px;
    padding: 12px;
    background: var(--bg, #EEF2F6);
    text-align: center;
  }
  .carb-upload-actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .carb-hint-text {
    font-size: 0.78rem;
    color: var(--muted, #5B6678);
    margin: 8px 0 0;
  }
  .carb-preview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .carb-preview-grid:empty {
    display: none;
  }
  .carb-thumb-wrap {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line, #D5DCE5);
    aspect-ratio: 4 / 3;
    background: #000;
  }
  .carb-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .carb-thumb-badge {
    position: absolute;
    left: 4px;
    bottom: 4px;
    background: rgba(15, 23, 36, 0.78);
    color: #fff;
    font-size: 0.68rem;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .carb-thumb-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    background: var(--red, #D93025);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 21px;
    height: 21px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .carb-tip-section {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .carb-label {
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--ink, #16233A);
  }
  .carb-input {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 11px;
    border: 1px solid var(--line, #D5DCE5);
    border-radius: 8px;
    font-size: 0.92rem;
    background: var(--bg, #EEF2F6);
    color: var(--ink, #16233A);
  }
  .carb-status {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    background: var(--accent-soft, #DCE7FB);
    color: var(--ink, #16233A);
    border: 1px solid var(--accent, #2463D6);
  }
  .carb-status.error {
    background: var(--red-soft, #FCE3E1);
    color: var(--red, #D93025);
    border-color: var(--red, #D93025);
  }
  .carb-result-section {
    background: var(--ok-soft, #E6F4EA);
    border: 1px solid var(--ok, #1E8E5A);
    border-radius: 10px;
    padding: 12px;
  }
  .carb-result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .carb-total-label {
    font-size: 1.02rem;
    color: var(--ink, #16233A);
  }
  .carb-btn-small {
    background: transparent;
    border: 1px solid var(--ok, #1E8E5A);
    color: var(--ok, #1E8E5A);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .carb-result-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
  }
  .carb-items-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .carb-item-row {
    display: grid;
    grid-template-columns: 1.8fr 1fr 0.9fr 24px;
    gap: 6px;
    align-items: center;
  }
  .carb-item-row.carb-item-readonly {
    grid-template-columns: 1.8fr 1fr 0.9fr;
    align-items: start;
  }
  .carb-item-label {
    min-width: 0;
    box-sizing: border-box;
    padding: 9px 10px;
    border: 1px solid var(--line, #D5DCE5);
    border-radius: 6px;
    background: var(--ok-soft, #E6F4EA);
    color: var(--ink, #16233A);
    overflow-wrap: anywhere;
  }
  .carb-item-name {
    font-weight: 500;
  }
  .carb-item-value {
    white-space: nowrap;
  }
  .carb-item-row input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 7px;
    border: 1px solid var(--line, #D5DCE5);
    border-radius: 6px;
    font-size: 0.85rem;
    background: var(--surface, #FFFFFF);
    color: var(--ink, #16233A);
  }
  .carb-weight-cell {
    display: flex;
    flex-direction: column;
  }
  .carb-dry-tag {
    font-size: 0.7rem;
    color: var(--ok, #1E8E5A);
    margin-top: 1px;
  }
  .carb-carbs-cell {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .carb-del-row {
    background: none;
    border: none;
    color: var(--red, #D93025);
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }
  .carb-note {
    font-size: 0.8rem;
    color: var(--ink, #16233A);
    margin: 8px 0 4px;
  }
  .carb-timing {
    font-size: 0.74rem;
    color: var(--muted, #5B6678);
    margin: 0;
  }
  .carb-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line, #D5DCE5);
  }
  .carb-btn {
    padding: 9px 14px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .carb-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .carb-btn-dark {
    background: var(--accent, #2463D6);
    color: #fff;
  }
  .carb-btn-light {
    background: var(--surface, #FFFFFF);
    color: var(--ink, #16233A);
    border: 1px solid var(--line, #D5DCE5);
  }
  .carb-btn-primary {
    background: var(--accent, #2463D6);
    color: #fff;
  }
  .carb-btn-success {
    background: var(--ok, #1E8E5A);
    color: #fff;
  }
  .carb-disclaimer {
    font-size: 0.72rem;
    color: var(--muted, #5B6678);
    margin: 0;
    line-height: 1.35;
  }
</style>

<dialog id="carbModal" class="carb-modal">
  <div class="carb-container">
    <div class="carb-header">
      <h3 class="carb-title">Kohlenhydrate per Foto erfassen</h3>
      <button type="button" id="carbCloseTopBtn" class="carb-icon-btn" aria-label="Schließen">&times;</button>
    </div>

    <div class="carb-models" role="radiogroup" aria-label="KI-Modell wählen">
      <label class="carb-model-card active" data-provider="groq">
        <input type="radio" name="carbProvider" value="groq" checked />
        <span class="carb-model-name">Blitz-Scan (~1,5 s)</span>
        <span class="carb-model-sub">Groq Qwen 3.8 + Fallback</span>
      </label>
      <label class="carb-model-card" data-provider="gemini">
        <input type="radio" name="carbProvider" value="gemini" />
        <span class="carb-model-name">Detail-Scan (~8–10 s)</span>
        <span class="carb-model-sub">Gemini 3 Flash (Soßen & Extras)</span>
      </label>
      <label class="carb-model-card" data-provider="custom">
        <input type="radio" name="carbProvider" value="custom" />
        <span class="carb-model-name">Benutzerdefiniert</span>
        <span class="carb-model-sub" id="carbCustomSubLabel">Eigene API-URL & Key</span>
      </label>
    </div>

    <div class="carb-upload-section">
      <div class="carb-upload-actions">
        <button type="button" id="carbCameraBtn" class="carb-btn carb-btn-dark">Foto aufnehmen</button>
        <button type="button" id="carbGalleryBtn" class="carb-btn carb-btn-light">Aus Mediathek / Datei</button>
      </div>
      <p class="carb-hint-text">Bis zu 3 Perspektiven möglich (z. B. Draufsicht + 45°-Winkel).</p>
      <input type="file" id="carbCameraInput" accept="image/*" capture="environment" hidden />
      <input type="file" id="carbGalleryInput" accept="image/*" multiple hidden />
      <div id="carbPreviewGrid" class="carb-preview-grid"></div>
    </div>

    <div class="carb-tip-section">
      <label for="carbUserTip" class="carb-label">Optionaler Hinweis / Tipp für die KI</label>
      <input
        type="text"
        id="carbUserTip"
        class="carb-input"
        placeholder="z. B. Dünner Teig, Soße mit Stärke gebunden, Cola Zero..."
      />
    </div>

    <div id="carbStatusBox" class="carb-status" hidden></div>

    <div id="carbResultSection" class="carb-result-section" hidden>
      <div class="carb-result-header">
        <span class="carb-total-label">Gesamt: <strong id="carbTotalCarbs">0</strong> g Kohlenhydrate</span>
        <div class="carb-result-actions">
          <button type="button" id="carbEditToggleBtn" class="carb-btn-small" aria-pressed="false" aria-controls="carbItemsList">Werte korrigieren</button>
          <button type="button" id="carbAddRowBtn" class="carb-btn-small" hidden>+ Zutat</button>
        </div>
      </div>
      <div id="carbItemsList" class="carb-items-list"></div>
      <p id="carbAnalysisNote" class="carb-note"></p>
      <p id="carbTimingInfo" class="carb-timing"></p>
    </div>

    <div class="carb-footer">
      <button type="button" id="carbCancelBtn" class="carb-btn carb-btn-light">Abbrechen</button>
      <button type="button" id="carbAnalyzeBtn" class="carb-btn carb-btn-primary">Analysieren</button>
      <button type="button" id="carbApplyBtn" class="carb-btn carb-btn-success" hidden>Werte übernehmen</button>
    </div>

    <p class="carb-disclaimer">
      Ausschließlich zu Informationszwecken. Für medizinischen Rat oder eine Diagnose wende dich bitte an eine Fachkraft. Antworten von KI-Systemen können Fehler enthalten.
    </p>
  </div>
</dialog>
